<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fa;
}

.header{
background:#081425;
color:white;
text-align:center;
padding:50px;
}

.container{
max-width:1100px;
margin:auto;
padding:50px 20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.info,.form-box{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.info h2,
.form-box h2{
color:#081425;
margin-bottom:20px;
}

.info p{
margin-bottom:15px;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
background:#081425;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;
}

footer{
background:#081425;
color:white;
text-align:center;
padding:20px;
margin-top:20px;
}

@media(max-width:768px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<div class="header">
<h1>Contact Us</h1>
<p>Get in touch with us</p>
</div>

<div class="container">

<div class="info">
<h2>College Information</h2>

<p><b>College:</b> Shivaji English School & Junior College</p>

<p><b>Address:</b> Your College Address Here</p>

<p><b>Phone:</b> +91 XXXXX XXXXX</p>

<p><b>Email:</b> college@email.com</p>

<p><b>Website:</b> www.collegewebsite.com</p>

</div>

<div class="form-box">

<h2>Send Message</h2>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<input type="text" placeholder="Subject">

<textarea rows="5" placeholder="Your Message"></textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

</div>

<footer>
© Shivaji English School & Junior College
</footer>

</body>
</html>
