<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1920');
background-size:cover;
background-position:center;
}

.admin-box{
width:500px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(20px);
padding:40px;
border-radius:25px;
border:1px solid rgba(255,255,255,.2);
box-shadow:0 15px 40px rgba(0,0,0,.4);
color:white;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
font-size:30px;
}

.logo p{
color:#d4a437;
font-size:14px;
}

.title{
text-align:center;
font-size:26px;
font-weight:700;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
outline:none;
border-radius:10px;
font-size:15px;
}

.forgot{
text-align:right;
margin-bottom:20px;
}

.forgot a{
color:#d4a437;
text-decoration:none;
}

.face-btn{
width:100%;
padding:14px;
background:#10294a;
border:none;
border-radius:10px;
color:white;
font-weight:600;
margin-bottom:15px;
cursor:pointer;
}

.login-btn{
width:100%;
padding:15px;
background:#d4a437;
border:none;
border-radius:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.login-btn:hover{
opacity:.9;
}

</style>
</head>
<body>

<div class="admin-box">

<div class="logo">
<h1>SHIVAJI ENGLISH SCHOOL</h1>
<p>& JUNIOR COLLEGE OF ARTS, COMMERCE & SCIENCE</p>
</div>

<div class="title">
ADMIN LOGIN
</div>

<form onsubmit="adminLogin(event)">

<input type="text"
placeholder="Admin Username"
required>

<input type="email"
placeholder="Admin Email"
required>

<input type="password"
placeholder="Password"
required>

<div class="forgot">
<a href="forgot-password.html">
Forgot Password?
</a>
</div>

<button type="button" class="face-btn">
    Face Scan
</button>

<button type="submit" class="login-btn">
    LOGIN AS ADMIN
</button>

</form>

<script>

function adminLogin(event) {

    event.preventDefault();

    window.location.href = "admin-dashboard.html";

}

</script>

</body>
</html>
