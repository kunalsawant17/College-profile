<!DOCTYPE html>
<html>
<head>
<title>Toppers</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#081425;color:white;padding:30px;text-align:center}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}
.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}
.card img{
width:120px;
height:120px;
border-radius:50%;
}
</style>
</head>
<body>

<header>
<h1>College Toppers</h1>
</header>

<div class="grid">

<div class="card">
<img src="https://randomuser.me/api/portraits/women/44.jpg">
<h2>Student Name</h2>
<p>Science Stream</p>
<p>95.40%</p>
</div>

<div class="card">
<img src="https://randomuser.me/api/portraits/men/32.jpg">
<h2>Student Name</h2>
<p>Commerce Stream</p>
<p>93.20%</p>
</div>

<div class="card">
<img src="https://randomuser.me/api/portraits/women/68.jpg">
<h2>Student Name</h2>
<p>Arts Stream</p>
<p>91.80%</p>
</div>

</div>

</body>
</html>
