<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1920');
background-size:cover;
background-position:center;
}

.container{
width:400px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#081425;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#081425;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#10294a;
}

.link{
text-align:center;
margin-top:15px;
}

.link a{
color:#081425;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>Student Login</h2>

<form>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="link">
<a href="register.html">Create New Account</a>
</div>

</div>

</body>
</html>
